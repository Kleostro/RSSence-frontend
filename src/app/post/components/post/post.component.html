@let post = this.post();
@let isSHhowPostAction =
  this.isShowPostActions() && this.userService.me()?.author?.id === this.getAuthor()?.id && this.mode() === 'full';

@if (post) {
  <div class="post">
    <header class="post-header">
      <app-post-avatar [post]="post" [author]="this.getAuthor()" />

      <div *ngIf="this.getCoauthors().length" class="post-coauthors-wrapper">
        <app-coauthors-list [coauthors]="this.getCoauthors()" />
      </div>

      <div class="post-actions">
        <button
          *ngIf="isSHhowPostAction"
          class="post-edit-btn"
          pButton
          pRipple
          type="button"
          [icon]="isProcessing() ? 'pi pi-spin pi-spinner' : 'pi pi-pencil'"
          severity="success"
          outlined="true"
          rounded="true"
          [disabled]="isProcessing()"
          (click)="$event.stopPropagation()"
        ></button>
        <button
          *ngIf="isSHhowPostAction"
          class="post-delete-btn"
          pButton
          pRipple
          type="button"
          [icon]="isProcessing() ? 'pi pi-spin pi-spinner' : 'pi pi-trash'"
          severity="danger"
          outlined="true"
          rounded="true"
          [disabled]="isProcessing()"
          (click)="$event.stopPropagation(); this.deletePost(post)"
        ></button>

        <button
          pButton
          pRipple
          type="button"
          (click)="$event.stopPropagation(); this.mode.set(this.mode() === 'preview' ? 'full' : 'preview')"
          [icon]="
            this.mode() === 'preview'
              ? 'pi pi-arrow-up-right-and-arrow-down-left-from-center'
              : 'pi pi-arrow-down-left-and-arrow-up-right-to-center'
          "
          class="switch-mode-button"
          severity="info"
          outlined="true"
          rounded="true"
        ></button>
      </div>
    </header>

    <body class="post-body">
      <h1 class="post-title">{{ post.title }}</h1>
      <p class="post-content" *ngIf="this.mode() === 'full'" [innerHTML]="this.safeHtml()"></p>
    </body>

    <footer class="post-footer"></footer>
  </div>
} @else {
  <div class="not-found">
    <p class="not-found-text">Not found post</p>
    <img class="not-found-img" src="img/png/not-found.png" alt="not found" />
  </div>
}
