@let post = this.post();
@let author = this.author();

<p-avatar
  shape="circle"
  class="post-avatar-img"
  [image]="author.avatarUrl ?? 'img/svg/avatar-placeholder.svg'"
  size="normal"
  [routerLink]="['/author', author.userId]"
  (click)="$event.stopPropagation()"
/>
<a [routerLink]="['/author', author.userId]" class="post-author-link" (click)="$event.stopPropagation()">{{
  author.username
}}</a>
<span class="post-createdAt">{{ post.createdAt | date: 'medium' }}</span>
