@let author = this.author();

<div class="author-info">
  <p-avatar
    shape="circle"
    class="post-avatar-img"
    [image]="author?.avatarUrl ?? 'img/svg/avatar-placeholder.svg'"
    size="normal"
    [routerLink]="['/author', author?.username]"
  />
  <a [routerLink]="['/author', author?.username]" class="post-author-link">{{ author?.username }}</a>
</div>
