@if (this.paginatedPostResponse(); as paginatedPostResponse) {
  @let posts = paginatedPostResponse.items;
  @let limit = paginatedPostResponse.limit;
  @let total = paginatedPostResponse.total;

  <p-paginator
    class="posts-list-paginator"
    (onPageChange)="onPageChange($event)"
    [first]="first"
    [rows]="limit"
    [totalRecords]="total"
    [rowsPerPageOptions]="[10, 20, 30, 50, 100]"
  />
  @for (post of posts; track post.id; let i = $index) {
    <div
      class="post-wrapper"
      tabindex="0"
      (click)="this.navigationService.navigateToPostById(post.id)"
      (keyup)="($event.key === 'Enter' || $event.key === ' ') && this.navigationService.navigateToPostById(post.id)"
    >
      <app-post
        [post]="post"
        [isShowPostActions]="this.isShowPostActions()"
        [author]="this.authorService.findAuthorById(post.authorId)"
      />
    </div>
  } @empty {
    <div class="not-found">
      <p class="not-found-text">Not found any posts</p>
      <img class="not-found-img" src="img/png/not-found.png" alt="not found" />
    </div>
  }

  <p-paginator
    class="posts-list-paginator"
    (onPageChange)="onPageChange($event)"
    [first]="first"
    [rows]="limit"
    [totalRecords]="total"
    [rowsPerPageOptions]="[10, 20, 30, 50, 100]"
  />
}
