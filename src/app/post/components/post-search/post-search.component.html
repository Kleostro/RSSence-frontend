<form class="search-form" [formGroup]="this.searchForm">
  <span class="posts-search-title">Search:</span>
  <div class="search-form-checkboxes">
    @for (searchField of this.searchFields; track i; let i = $index) {
      <div class="search-form-checkbox">
        <p-radiobutton
          [inputId]="searchField.label"
          name="searchField"
          [value]="searchField.value"
          variant="filled"
          formControlName="searchField"
          (onClick)="this.inputPlaceholder.set(searchField.placeholder)"
        />
        <label class="search-form-checkbox-label" [for]="searchField.label">{{ searchField.label }}</label>
      </div>
    }
  </div>
  <input
    class="search-form-input"
    type="search"
    pInputText
    formControlName="search"
    [placeholder]="this.inputPlaceholder()"
    variant="filled"
  />
</form>
