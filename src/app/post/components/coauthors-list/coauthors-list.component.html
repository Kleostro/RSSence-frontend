@let coauthors = this.coauthors();

<p-avatar-group class="coauthors-avatar-group">
  @for (coauthor of coauthors; track $index) {
    <p-avatar
      [@coauthorCollapse]
      class="coauthors-avatar"
      *ngIf="!this.isShortCoauthors() || $index < 3"
      [pTooltip]="coauthor.username"
      tooltipPosition="bottom"
      [image]="coauthor.avatarUrl ?? 'img/svg/avatar-placeholder.svg'"
      size="normal"
      [routerLink]="['/author', coauthor.username]"
      shape="circle"
    />
  }

  <p-avatar
    class="coauthors-avatar"
    *ngIf="coauthors.length > 3"
    [label]="this.isShortCoauthors() ? '+' + (coauthors.length - 3) : ''"
    [icon]="this.isShortCoauthors() ? 'pi pi-users' : 'pi pi-ellipsis-h'"
    [style]="{
      'background-color': 'var(--p-primary-400)',
      color: 'var(--p-primary-contrast-color)',
      'font-size': '0.8rem',
    }"
    shape="circle"
    size="normal"
    (click)="this.isShortCoauthors.set(!this.isShortCoauthors())"
  />
</p-avatar-group>
