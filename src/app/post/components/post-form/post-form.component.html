<form class="form" [formGroup]="form" (submit)="submit()">
  <label for="title">Title</label>
  <input class="title-input" pInputText fluid="true" id="title" formControlName="title" autocomplete="off" />

  <label for="content">Content</label>
  <textarea
    class="content-input"
    pInputText
    fluid="true"
    id="content"
    formControlName="content"
    autocomplete="off"
  ></textarea>

  <div class="multiple-select">
    <ng-container formArrayName="imageUrls">
      <div class="imageUrls">
        <span>Add up to 5 images</span>
        <div class="image-url-wrapper">
          @for (imageFG of form.controls.imageUrls.controls; track imageFG; let i = $index) {
            <div [formGroup]="imageFG">
              <div class="image-wrapper">
                <div class="image-control">
                  <label [for]="'image-' + i">Image {{ i + 1 }}</label>
                  <input
                    class="image-url-input"
                    pInputText
                    fluid="true"
                    [id]="'image-' + i"
                    formControlName="imageUrl"
                  />
                </div>
                <button
                  class="remove-image-btn"
                  pButton
                  pRipple
                  type="button"
                  [icon]="isProcessing() ? 'pi pi-spin pi-spinner' : 'pi pi-trash'"
                  rounded="true"
                  severity="danger"
                  outlined="true"
                  (click)="form.controls.imageUrls.removeAt(i)"
                ></button>
              </div>
            </div>
          }
        </div>
        <div class="buttons-wrapper">
          <button
            pButton
            pRipple
            type="button"
            fluid="true"
            label="Add"
            [icon]="isProcessing() ? 'pi pi-spin pi-spinner' : 'pi pi-plus'"
            severity="success"
            outlined="true"
            *ngIf="form.controls.imageUrls.controls.length < 5"
            (click)="addImageUrl()"
            [disabled]="isProcessing()"
          ></button>
        </div>
      </div>
    </ng-container>

    <ng-container formArrayName="coauthors">
      <div class="coauthors">
        <span>Add up to 5 coauthors</span>
        <div class="coauthor-wrapper">
          @for (coauthorFG of form.controls.coauthors.controls; track coauthorFG; let i = $index) {
            <div [formGroup]="coauthorFG">
              <div class="coauthor-fg-wrapper">
                <div class="coauthor-control">
                  <label [for]="'coauthor-' + i">Coauthor {{ i + 1 }}</label>
                  <p-autocomplete
                    formControlName="coauthor"
                    fluid="true"
                    [suggestions]="filteredAuthors"
                    (completeMethod)="filterAuthors($event)"
                    field="username"
                  >
                    <ng-template let-coauthor #item>
                      <div class="coauthor-item">
                        <p-avatar [image]="coauthor.avatarUrl ?? 'img/svg/avatar-placeholder.svg'"></p-avatar>
                        <span>{{ coauthor.username }}</span>
                      </div>
                    </ng-template>
                  </p-autocomplete>
                </div>
                <button
                  class="remove-coauthor-btn"
                  pButton
                  pRipple
                  type="button"
                  [icon]="isProcessing() ? 'pi pi-spin pi-spinner' : 'pi pi-trash'"
                  severity="danger"
                  outlined="true"
                  rounded="true"
                  (click)="form.controls.coauthors.removeAt(i)"
                  [disabled]="isProcessing()"
                ></button>
              </div>
            </div>
          }
        </div>
        <div class="buttons-wrapper">
          <button
            pButton
            pRipple
            type="button"
            label="Add"
            fluid="true"
            [icon]="isProcessing() ? 'pi pi-spin pi-spinner' : 'pi pi-plus'"
            severity="success"
            outlined="true"
            *ngIf="form.controls.coauthors.controls.length < 5"
            (click)="addCoauthor()"
            [disabled]="isProcessing()"
          ></button>
        </div>
      </div>
    </ng-container>
  </div>

  <div class="form-footer">
    <button
      pButton
      pRipple
      type="submit"
      fluid="true"
      [label]="isProcessing() ? 'Posting...' : 'Post'"
      [icon]="isProcessing() ? 'pi pi-spin pi-spinner' : 'pi pi-check'"
      [disabled]="form.invalid || isProcessing()"
      severity="success"
      outlined="true"
    ></button>
  </div>
</form>
