<div class="page">
  <p-button
    pRipple
    class="back-button"
    type="button"
    (click)="this.navigationService.goBack()"
    label="Back"
    icon="pi pi-arrow-left"
    severity="info"
    outlined="true"
  />

  <app-posts-list
    [isShowPostActions]="false"
    [paginatedPostResponse]="this.paginatedPostResponse()"
    (pageChangeEvent)="this.handlePageChangeEvent($event)"
  />
</div>
