@let posts = this.postService.allPosts();

<div class="page">
  <p-button
    pRipple
    class="back-button"
    type="button"
    (click)="this.navigationService.goBack()"
    label="Back"
    icon="pi pi-arrow-left"
    severity="info"
    outlined="true"
  />

  <app-posts-list [posts]="posts" />
</div>
