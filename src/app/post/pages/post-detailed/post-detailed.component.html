@let post = this.currentPost();

<div class="page">
  <p-button
    pRipple
    class="back-button"
    type="button"
    (click)="this.navigationService.goBack()"
    label="Back"
    icon="pi pi-arrow-left"
    severity="info"
    outlined="true"
  />

  @if (post !== undefined) {
    <app-post [post]="post" [author]="this.authorService.findAuthorById(post?.authorId ?? null)" />
  }
</div>
