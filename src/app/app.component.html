@let isPageLoading = this.loaderService.isPageLoading();

<div class="app">
  <app-sidebar />
  <div class="app-content">
    <div class="app-content-wrapper">
      <app-header />

      <div class="app-page-wrapper">
        @if (!isPageLoading) {
          <router-outlet class="app-router-outlet" />
        } @else {
          <app-page-loader />
        }
      </div>
    </div>
  </div>
</div>

<p-toast position="bottom-left" />
<app-modal />
