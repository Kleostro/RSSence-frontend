@let currentProfile = this.currentProfile();

<div class="page">
  @if (currentProfile) {
    <div class="profile-info">
      <app-profile-info
        [isMyPage]="false"
        [currentProfile]="currentProfile"
        (navigateToAuthor)="navigationService.navigateToAuthorByUsername($event)"
      />
    </div>
  }
</div>
