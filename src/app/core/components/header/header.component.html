<div class="header-wrapper">
  <header class="header">
    @if (this.authService.isUserLoggedIn()) {
      <app-sidebar />
    }
  </header>
  @if (this.loaderService.isProcessing()) {
    <p-progressbar
      mode="indeterminate"
      [style]="{ height: '0.05rem', position: 'absolute', bottom: '0', width: '100%' }"
    />
  }
</div>
