<div class="page">
  <div class="posts-list">
    <app-posts-list [paginatedPostResponse]="this.paginatedPostResponse()" (pageChange)="this.handlePageChange($event)">
      <ng-template let-post>
        <app-moderation-post [post]="post" />
      </ng-template>
    </app-posts-list>
  </div>
</div>
