<div class="page">
  <app-posts-list [paginatedPostResponse]="this.paginatedPostResponse()" (pageChange)="this.handlePageChange($event)">
    <ng-template let-post>
      <app-moderation-post [post]="post" [isShowPostModeratorActions]="true" (postEvent)="this.handlePostEvent()" />
    </ng-template>
  </app-posts-list>
</div>
