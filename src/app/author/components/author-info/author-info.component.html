@let currentAuthor = this.currentAuthor();
@let isMyPage = this.isMyPage();
@let navigationItems = this.navigationItems();

<div class="author-info">
  @if (isMyPage) {
    <p-speeddial
      [model]="navigationItems"
      direction="left"
      [buttonProps]="{ severity: 'primary', outlined: true }"
      [tooltipOptions]="{ tooltipPosition: 'bottom' }"
      [style]="{ position: 'absolute', right: '1rem', top: '1rem' }"
    />
  } @else if (currentAuthor) {
    <p-button
      pRipple
      type="button"
      class="move-to-profile-button"
      label="Profile"
      icon="pi pi-user"
      severity="info"
      outlined="true"
      (click)="navigateToProfile.emit(currentAuthor?.profileUsername)"
    />
  }
  <app-author-preview [author]="currentAuthor" />
</div>
